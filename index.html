<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grayline Weapon Visual Archive</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #171819;
    }

    body {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      user-select: none;
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hud {
      position: fixed;
      inset: 22px 28px auto;
      z-index: 10;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
    }

    .brand {
      color: #939897;
      font-size: 10px;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .brand strong {
      display: block;
      margin-bottom: 5px;
      color: #edf1ee;
      font-size: 13px;
      letter-spacing: .16em;
    }

    .controls {
      color: #777d7a;
      text-align: right;
      font-size: 9px;
      line-height: 2;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .name {
      position: fixed;
      left: 28px;
      bottom: 19px;
      z-index: 10;
      color: #8e9491;
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .navigation {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 10;
      display: flex;
      gap: 7px;
      transform: translateX(-50%);
    }

    .dot {
      width: 34px;
      height: 3px;
      padding: 0;
      border: 0;
      background: #717675;
      opacity: .28;
      cursor: pointer;
      transition: opacity .25s, background .25s;
    }

    .dot.active {
      background: #d9dfdb;
      opacity: 1;
    }

    .hint {
      position: fixed;
      right: 28px;
      bottom: 22px;
      z-index: 10;
      color: #777d7a;
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud">
    <div class="brand">
      <strong id="series">GRAYLINE // 01</strong>
      <span id="subtitle">POLYMER SERVICE WEAPON</span>
    </div>
    <div class="controls">
      Left hold — automatic<br>
      Left / Right click — shot
    </div>
  </div>

  <div class="name" id="weaponName">GL-01 Warden</div>

  <nav class="navigation" aria-label="Weapon selection">
    <button class="dot active" aria-label="Warden"></button>
    <button class="dot" aria-label="Helios"></button>
    <button class="dot" aria-label="Voidbreach"></button>
  </nav>

  <div class="hint">A / D · change weapon</div>

  <script>
    "use strict";

    const canvas = document.querySelector("#scene");
    const ctx = canvas.getContext("2d", { alpha: false });

    let width = 0;
    let height = 0;
    let pixelRatio = 1;
    let lastFrame = 0;
    let elapsed = 0;
    let mouseDown = false;
    let lastShot = -1000;
    let recoil = 0;
    let boltTravel = 0;
    let muzzleAmount = 0;
    let weaponIndex = 0;

    const particles = [];
    const smoke = [];
    const casings = [];
    const tracers = [];
    const rings = [];
    const sparks = [];
    const embers = [];

    const weaponNames = [
      "GL-01 Warden",
      "LX-7 Helios",
      "VX-4 Voidbreach"
    ];

    const weaponSubtitles = [
      "POLYMER SERVICE WEAPON",
      "PHOTON SIDEARM",
      "PLASMA LONG WEAPON"
    ];

    function resize() {
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * pixelRatio;
      canvas.height = height * pixelRatio;
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }

    window.addEventListener("resize", resize);
    resize();

    for (let i = 0; i < 40; i++) {
      embers.push({
        x: Math.random(),
        y: Math.random(),
        radius: 0.3 + Math.random() * 0.8,
        alpha: 0.025 + Math.random() * 0.05,
        phase: Math.random() * Math.PI * 2
      });
    }

    function roundedRectangle(x, y, w, h, radius = 0) {
      radius = Math.min(radius, w * 0.5, h * 0.5);

      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function strokeLine(x1, y1, x2, y2) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function createMetalGradient(x, y, w, h, light = 0.5) {
      const gradient = ctx.createLinearGradient(x, y, x, y + h);

      gradient.addColorStop(0, "#a7aba9");
      gradient.addColorStop(0.07, `rgba(130, 135, 133, ${light})`);
      gradient.addColorStop(0.23, "#303435");
      gradient.addColorStop(0.45, "#17191a");
      gradient.addColorStop(0.62, "#555a59");
      gradient.addColorStop(0.82, "#242728");
      gradient.addColorStop(1, "#101213");

      return gradient;
    }

    function createWoodGradient(x, y, w, h) {
      const gradient = ctx.createLinearGradient(x, y, x + w, y + h);

      gradient.addColorStop(0, "#6a3927");
      gradient.addColorStop(0.18, "#4a281d");
      gradient.addColorStop(0.42, "#83503a");
      gradient.addColorStop(0.68, "#593124");
      gradient.addColorStop(1, "#322016");

      return gradient;
    }

    function origin() {
      const scale = Math.min(width, height) / 720;

      return {
        x: width * 0.29 - recoil * scale * 14,
        y: height * 0.50,
        scale
      };
    }

    function muzzlePosition() {
      const o = origin();

      if (weaponIndex === 0) {
        return {
          x: o.x + 690 * o.scale,
          y: o.y - 12 * o.scale
        };
      }

      if (weaponIndex === 1) {
        return {
          x: o.x + 650 * o.scale,
          y: o.y - 2 * o.scale
        };
      }

      return {
        x: o.x + 720 * o.scale,
        y: o.y + 8 * o.scale
      };
    }

    function createStandardShot(mx, my, o) {
      tracers.push({
        type: 0,
        x1: mx,
        y1: my,
        x2: mx + Math.min(width * 0.56, 620),
        y2: my - 2 - Math.random() * 7,
        alpha: 1,
        width: 1.3
      });

      casings.push({
        x: o.x + 270 * o.scale,
        y: o.y - 58 * o.scale,
        vx: 150 + Math.random() * 110,
        vy: -210 - Math.random() * 90,
        vr: (Math.random() - 0.5) * 18,
        rotation: Math.random() * Math.PI * 2,
        alpha: 1,
        life: 0,
        maxLife: 1.8
      });

      for (let i = 0; i < 5; i++) {
        smoke.push({
          x: mx,
          y: my,
          vx: 16 + Math.random() * 25,
          vy: -10 - Math.random() * 18,
          radius: 7 + Math.random() * 9,
          alpha: 0.22,
          life: 0,
          maxLife: 1.2 + Math.random() * 0.7,
          spin: Math.random() * Math.PI * 2
        });
      }

      for (let i = 0; i < 18; i++) {
        const angle = (Math.random() - 0.5) * 1.1;
        const velocity = 120 + Math.random() * 330;

        particles.push({
          x: mx,
          y: my,
          vx: Math.cos(angle) * velocity + 180,
          vy: Math.sin(angle) * velocity,
          alpha: 1,
          radius: 0.5 + Math.random() * 2,
          life: 0,
          maxLife: 0.18 + Math.random() * 0.28,
          type: 0
        });
      }
    }

    function createLaserShot(mx, my) {
      tracers.push({
        type: 1,
        x1: mx,
        y1: my,
        x2: mx + Math.min(width * 0.62, 680),
        y2: my,
        alpha: 1,
        width: 2.4
      });

      rings.push({
        x: mx,
        y: my,
        radius: 4,
        alpha: 1,
        growth: 42,
        cyan: true
      });

      for (let i = 0; i < 38; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = 40 + Math.random() * 210;

        sparks.push({
          x: mx,
          y: my,
          vx: Math.cos(angle) * velocity + 100,
          vy: Math.sin(angle) * velocity,
          alpha: 0.9,
          radius: 0.5 + Math.random() * 1.5,
          life: 0,
          maxLife: 0.25 + Math.random() * 0.55
        });
      }
    }

    function createPlasmaShot(mx, my) {
      tracers.push({
        type: 2,
        x1: mx,
        y1: my,
        x2: mx + Math.min(width * 0.58, 600),
        y2: my - 4 - Math.random() * 12,
        alpha: 1,
        width: 3.2
      });

      rings.push({
        x: mx,
        y: my,
        radius: 5,
        alpha: 1,
        growth: 64,
        cyan: false
      });

      for (let i = 0; i < 26; i++) {
        const angle = (Math.random() - 0.5) * 0.8;
        const velocity = 80 + Math.random() * 250;

        particles.push({
          x: mx,
          y: my,
          vx: Math.cos(angle) * velocity + 150,
          vy: Math.sin(angle) * velocity,
          alpha: 1,
          radius: 0.7 + Math.random() * 2.5,
          life: 0,
          maxLife: 0.15 + Math.random() * 0.38,
          type: 2
        });
      }
    }

    function fireWeapon() {
      const now = performance.now();
      const cooldown =
        weaponIndex === 1 ? 150 :
        weaponIndex === 2 ? 210 :
        78;

      if (now - lastShot < cooldown) {
        return;
      }

      lastShot = now;
      recoil = 1;
      boltTravel = 1;
      muzzleAmount = 1;

      const position = muzzlePosition();
      const o = origin();

      if (weaponIndex === 0) {
        createStandardShot(position.x, position.y, o);
      } else if (weaponIndex === 1) {
        createLaserShot(position.x, position.y);
      } else {
        createPlasmaShot(position.x, position.y);
      }
    }

    window.addEventListener("contextmenu", event => {
      event.preventEventDefault();
    });

    window.addEventListener("mousedown", event => {
      if (event.button === 0) {
        mouseDown = true;
        fireWeapon();
      }

      if (event.button === 2) {
        fireWeapon();
      }
    });

    window.addEventListener("mouseup", event => {
      if (event.button === 0) {
        mouseDown = false;
      }
    });

    window.addEventListener("mouseleave", () => {
      mouseDown = false;
    });

    function setWeapon(index) {
      weaponIndex = (index + 3) % 3;

      document.querySelectorAll(".dot").forEach((dot, dotIndex) => {
        dot.classList.toggle("active", dotIndex === weaponIndex);
      });

      document.querySelector("#series").textContent =
        `GRAYLINE // 0${weaponIndex + 1}`;

      document.querySelector("#subtitle").textContent =
        weaponSubtitles[weaponIndex];

      document.querySelector("#weaponName").textContent =
        weaponNames[weaponIndex];

      particles.length = 0;
      smoke.length = 0;
      casings.length = 0;
      tracers.length = 0;
      rings.length = 0;
      sparks.length = 0;
    }

    window.addEventListener("keydown", event => {
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
        setWeapon(weaponIndex + 1);
      }

      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
        setWeapon(weaponIndex - 1);
      }
    });

    document.querySelectorAll(".dot").forEach((dot, index) => {
      dot.addEventListener("click", () => setWeapon(index));
    });

    function drawBackground(time) {
      const gradient = ctx.createRadialGradient(
        width * 0.38,
        height * 0.46,
        10,
        width * 0.48,
        height * 0.54,
        Math.max(width, height) * 0.78
      );

      gradient.addColorStop(0, "#303233");
      gradient.addColorStop(0.58, "#262829");
      gradient.addColorStop(1, "#171819");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.globalAlpha = 0.018;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 0.5;

      for (let i = 0; i < 16; i++) {
        const y = i * 68 + (time * 0.012) % 68;
        strokeLine(0, y, width, y);
      }

      for (const ember of embers) {
        const x =
          ember.x * width +
          Math.sin(time * 0.00008 + ember.phase) * 5;

        const y =
          ember.y * height +
          Math.cos(time * 0.00007 + ember.phase) * 4;

        ctx.globalAlpha = ember.alpha;
        ctx.fillStyle = "#dfe5df";
        ctx.beginPath();
        ctx.arc(x, y, ember.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawShadow(scale) {
      ctx.save();
      ctx.globalAlpha = 0.34;
      ctx.filter = `blur(${10 * scale}px)`;
      ctx.fillStyle = "#101112";
      roundedRectangle(-220 * scale, 112 * scale, 870 * scale, 18 * scale, 10 * scale);
      ctx.fill();
      ctx.restore();
      ctx.filter = "none";
    }

    function drawWarden(scale) {
      ctx.fillStyle = "#3b1e14";
      roundedRectangle(-205 * scale, -1 * scale, 210 * scale, 78 * scale, 10 * scale);
      ctx.fill();

      ctx.fillStyle = "#5a3020";
      roundedRectangle(-195 * scale, 8 * scale, 178 * scale, 49 * scale, 8 * scale);
      ctx.fill();

      ctx.strokeStyle = "#21140f";
      ctx.lineWidth = 2 * scale;
      roundedRectangle(-195 * scale, 8 * scale, 178 * scale, 49 * scale, 8 * scale);
      ctx.stroke();

      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = "#d39a72";
      ctx.lineWidth = 0.7 * scale;

      for (let i = 0; i < 8; i++) {
        strokeLine(
          (-178 + i * 16) * scale,
          (18 + i * 3) * scale,
          (-32 + i * 7) * scale,
          (50 - i * 2) * scale
        );
      }

      ctx.restore();

      ctx.fillStyle = "#151718";
      roundedRectangle(-220 * scale, 6 * scale, 35 * scale, 66 * scale, 8 * scale);
      ctx.fill();

      ctx.fillStyle = "#383c3c";
      roundedRectangle(-216 * scale, 12 * scale, 8 * scale, 54 * scale, 3 * scale);
      ctx.fill();

      ctx.fillStyle = createMetalGradient(-20 * scale, -35 * scale, 330 * scale, 100 * scale, 0.7);
      roundedRectangle(-20 * scale, -35 * scale, 330 * scale, 100 * scale, 7 * scale);
      ctx.fill();

      ctx.fillStyle = "#151718";
      roundedRectangle(0, -23 * scale, 288 * scale, 76 * scale, 5 * scale);
      ctx.fill();

      ctx.fillStyle = "#3c4040";
      roundedRectangle(12 * scale, -18 * scale, 260 * scale, 7 * scale, 3 * scale);
      ctx.fill();

      ctx.fillStyle = createMetalGradient(-38 * scale, -47 * scale, 350 * scale, 17 * scale, 0.55);
      roundedRectangle(-38 * scale, -47 * scale, 350 * scale, 17 * scale, 4 * scale);
      ctx.fill();

      ctx.fillStyle = "#171919";

      for (let i = 0; i < 10; i++) {
        roundedRectangle(
          (-28 + i * 31) * scale,
          -43 * scale,
          18 * scale,
          5 * scale,
          1 * scale
        );
        ctx.fill();
      }

      ctx.fillStyle = createMetalGradient(260 * scale, -30 * scale, 310 * scale, 72 * scale, 0.58);
      roundedRectangle(260 * scale, -30 * scale, 310 * scale, 72 * scale, 8 * scale);
      ctx.fill();

      ctx.fillStyle = "#111314";
      roundedRectangle(285 * scale, -19 * scale, 260 * scale, 50 * scale, 5 * scale);
      ctx.fill();

      ctx.fillStyle = "#343838";

      for (let i = 0; i < 8; i++) {
        roundedRectangle(
          (300 + i * 29) * scale,
          -14 * scale,
          11 * scale,
          40 * scale,
          2 * scale
        );
        ctx.fill();
      }

      ctx.fillStyle = createMetalGradient(540 * scale, -15 * scale, 150 * scale, 30 * scale, 0.8);
      roundedRectangle(540 * scale, -15 * scale, 150 * scale, 30 * scale, 6 * scale);
      ctx.fill();

      ctx.fillStyle = "#171919";
      roundedRectangle(650 * scale, -24 * scale, 40 * scale, 48 * scale, 5 * scale);
      ctx.fill();

      ctx.fillStyle = "#090a0a";
      roundedRectangle(684 * scale, -14 * scale, 18 * scale, 28 * scale, 5 * scale);
      ctx.fill();

      ctx.fillStyle = "#151717";
      roundedRectangle(
        (145 - boltTravel * 12) * scale,
        -10 * scale,
        130 * scale,
        27 * scale,
        4 * scale
      );
      ctx.fill();

      ctx.fillStyle = "#777b79";
      roundedRectangle(
        (158 - boltTravel * 12) * scale,
        -4 * scale,
        92 * scale,
        13 * scale,
        3 * scale
      );
      ctx.fill();

      ctx.strokeStyle = "#151717";
      ctx.lineWidth = 5 * scale;
      strokeLine(155 * scale, 12 * scale, 123 * scale, 31 * scale);
      strokeLine(123 * scale, 31 * scale, 107 * scale, 31 * scale);

      ctx.fillStyle = "#59301f";
      roundedRectangle(80 * scale, 48 * scale, 220 * scale, 74 * scale, 8 * scale);
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      roundedRectangle(88 * scale, 55 * scale, 204 * scale, 60 * scale, 7 * scale);
      ctx.clip();

      ctx.fillStyle = createWoodGradient(88 * scale, 55 * scale, 204 * scale, 60 * scale);
      ctx.fillRect(88 * scale, 55 * scale, 204 * scale, 60 * scale);

      ctx.globalAlpha = 0.28;
      ctx.strokeStyle = "#24140d";

      for (let i = 0; i < 7; i++) {
        strokeLine(
          100 * scale,
          (64 + i * 9) * scale,
          280 * scale,
          (77 + i * 7) * scale
        );
      }

      ctx.restore();

      ctx.save();
      ctx.translate(105 * scale, 64 * scale);
      ctx.rotate(0.06);

      ctx.fillStyle = "#141616";
      roundedRectangle(0, 0, 92 * scale, 145 * scale, 9 * scale);
      ctx.fill();

      ctx.fillStyle = createMetalGradient(-4 * scale, 8 * scale, 96 * scale, 132 * scale, 0.38);
      roundedRectangle(-4 * scale, 8 * scale, 96 * scale, 132 * scale, 8 * scale);
      ctx.fill();

      ctx.fillStyle = "#171919";

      for (let i = 0; i < 6; i++) {
        roundedRectangle(
          6 * scale,
          (18 + i * 20) * scale,
          72 * scale,
          3 * scale,
          1 * scale
        );
        ctx.fill();
      }

      ctx.restore();

      ctx.save();
      ctx.translate(270 * scale, 50 * scale);
      ctx.rotate(-0.14);

      ctx.fillStyle = "#151717";
      roundedRectangle(-8 * scale, 0, 72 * scale, 112 * scale, 8 * scale);
      ctx.fill();

      ctx.fillStyle = "#4d2a1d";
      roundedRectangle(-2 * scale, 6 * scale, 60 * scale, 100 * scale, 7 * scale);
      ctx.fill();

      ctx.restore();

      ctx.strokeStyle = "#151717";
      ctx.lineWidth = 8 * scale;
      ctx.beginPath();
      ctx.moveTo(215 * scale, 54 * scale);
      ctx.lineTo(215 * scale, 92 * scale);
      ctx.quadraticCurveTo(260 * scale, 112 * scale, 292 * scale, 63 * scale);
      ctx.stroke();

      ctx.strokeStyle = "#656a69";
      ctx.lineWidth = 3 * scale;
      ctx.beginPath();
      ctx.moveTo(244 * scale, 60 * scale);
      ctx.quadraticCurveTo(232 * scale, 86 * scale, 248 * scale, 98 * scale);
      ctx.stroke();

      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = "#e1e3dc";
      ctx.lineWidth = 0.65 * scale;

      for (let i = 0; i < 24; i++) {
        const x = (10 + (i * 37) % 270) * scale;
        const y = (-24 + (i * 19) % 82) * scale;

        strokeLine(
          x,
          y,
          x + (5 + i % 6) * scale,
          y + (i % 3 - 1) * scale
        );
      }

      ctx.restore();
    }

    function drawHelios(scale) {
      ctx.fillStyle = createMetalGradient(-150 * scale, -16 * scale, 790 * scale, 54 * scale, 0.52);
      roundedRectangle(-150 * scale, -16 * scale, 790 * scale, 54 * scale, 14 * scale);
      ctx.fill();

      ctx.fillStyle = "#10191a";
      roundedRectangle(-135 * scale, -8 * scale, 760 * scale, 38 * scale, 10 * scale);
      ctx.fill();

      ctx.fillStyle = "#62efff";
      roundedRectangle(-115 * scale, -11 * scale, 650 * scale, 5 * scale, 3 * scale);
      ctx.fill();

      ctx.globalAlpha = 0.35;
      ctx.fillStyle = "#2bd3e8";
      roundedRectangle(-98 * scale, 30 * scale, 620 * scale, 4 * scale, 2 * scale);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.fillStyle = "#1b2527";
      ctx.beginPath();
      ctx.moveTo(-120 * scale, -16 * scale);
      ctx.lineTo(-205 * scale, -48 * scale);
      ctx.lineTo(-205 * scale, 55 * scale);
      ctx.lineTo(-80 * scale, 38 * scale);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#5b777a";
      ctx.lineWidth = 2 * scale;
      ctx.stroke();

      ctx.fillStyle = "#27383a";
      roundedRectangle(-54 * scale, -42 * scale, 210 * scale, 14 * scale, 7 * scale);
      ctx.fill();
      roundedRectangle(-32 * scale, 38 * scale, 190 * scale, 15 * scale, 7 * scale);
      ctx.fill();

      ctx.fillStyle = "#111719";
      roundedRectangle(520 * scale, -27 * scale, 150 * scale, 76 * scale, 18 * scale);
      ctx.fill();

      ctx.fillStyle = "#b6faff";
      roundedRectangle(624 * scale, -20 * scale, 42 * scale, 62 * scale, 12 * scale);
      ctx.fill();

      ctx.fillStyle = "#17262a";
      roundedRectangle(652 * scale, -12 * scale, 34 * scale, 46 * scale, 10 * scale);
      ctx.fill();

      ctx.strokeStyle = "#74f6ff";
      ctx.lineWidth = 3 * scale;
      roundedRectangle(652 * scale, -12 * scale, 34 * scale, 46 * scale, 10 * scale);
      ctx.stroke();

      ctx.fillStyle = "#111718";
      roundedRectangle(155 * scale, 38 * scale, 88 * scale, 118 * scale, 12 * scale);
      ctx.fill();

      ctx.fillStyle = "#26383a";
      roundedRectangle(168 * scale, 48 * scale, 62 * scale, 96 * scale, 9 * scale);
      ctx.fill();

      ctx.fillStyle = "#62dbe8";

      for (let i = 0; i < 5; i++) {
        roundedRectangle(
          177 * scale,
          (60 + i * 15) * scale,
          44 * scale,
          3 * scale,
          2 * scale
        );
        ctx.fill();
      }

      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      const core = ctx.createRadialGradient(
        430 * scale,
        10 * scale,
        2,
        430 * scale,
        10 * scale,
        170 * scale
      );

      core.addColorStop(0, "rgba(225,255,255,.75)");
      core.addColorStop(0.25, "rgba(65,233,255,.32)");
      core.addColorStop(1, "rgba(65,233,255,0)");

      ctx.fillStyle = core;
      ctx.fillRect(260 * scale, -160 * scale, 340 * scale, 340 * scale);
      ctx.restore();
    }

    function drawVoidbreach(scale) {
      ctx.fillStyle = "#182023";
      roundedRectangle(-210 * scale, -8 * scale, 280 * scale, 86 * scale, 16 * scale);
      ctx.fill();

      ctx.fillStyle = "#2d3738";
      roundedRectangle(-195 * scale, 0, 242 * scale, 64 * scale, 12 * scale);
      ctx.fill();

      ctx.fillStyle = "#1a1d21";
      ctx.beginPath();
      ctx.moveTo(-20 * scale, -45 * scale);
      ctx.lineTo(430 * scale, -60 * scale);
      ctx.lineTo(510 * scale, -28 * scale);
      ctx.lineTo(490 * scale, 76 * scale);
      ctx.lineTo(20 * scale, 92 * scale);
      ctx.lineTo(-20 * scale, 45 * scale);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#343b40";
      ctx.beginPath();
      ctx.moveTo(-4 * scale, -38 * scale);
      ctx.lineTo(410 * scale, -48 * scale);
      ctx.lineTo(470 * scale, -20 * scale);
      ctx.lineTo(450 * scale, 58 * scale);
      ctx.lineTo(20 * scale, 78 * scale);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#bd75ff";
      ctx.lineWidth = 5 * scale;
      ctx.beginPath();
      ctx.moveTo(40 * scale, -24 * scale);
      ctx.lineTo(380 * scale, -31 * scale);
      ctx.quadraticCurveTo(425 * scale, -28 * scale, 445 * scale, -8 * scale);
      ctx.stroke();

      ctx.strokeStyle = "#f0aaff";
      ctx.globalAlpha = 0.65;
      ctx.lineWidth = 1 * scale;
      ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.fillStyle = createMetalGradient(440 * scale, -32 * scale, 255 * scale, 80 * scale, 0.48);
      roundedRectangle(440 * scale, -32 * scale, 255 * scale, 80 * scale, 18 * scale);
      ctx.fill();

      ctx.fillStyle = "#15191c";
      roundedRectangle(595 * scale, -20 * scale, 100 * scale, 56 * scale, 18 * scale);
      ctx.fill();

      ctx.fillStyle = "#bd75ff";
      ctx.globalAlpha = 0.65;
      roundedRectangle(606 * scale, -14 * scale, 82 * scale, 44 * scale, 15 * scale);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.strokeStyle = "#6b5b79";
      ctx.lineWidth = 3 * scale;

      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo((20 + i * 82) * scale, -34 * scale);
        ctx.lineTo((50 + i * 82) * scale, 70 * scale);
        ctx.stroke();
      }

      ctx.fillStyle = "#17191c";
      roundedRectangle(95 * scale, 74 * scale, 105 * scale, 120 * scale, 13 * scale);
      ctx.fill();

      ctx.fillStyle = "#33393d";
      roundedRectangle(108 * scale, 84 * scale, 78 * scale, 98 * scale, 10 * scale);
      ctx.fill();

      ctx.fillStyle = "#1a1d20";
      ctx.beginPath();
      ctx.moveTo(-20 * scale, 62 * scale);
      ctx.lineTo(-180 * scale, 78 * scale);
      ctx.lineTo(-210 * scale, 125 * scale);
      ctx.lineTo(-26 * scale, 108 * scale);
      ctx.closePath();
      ctx.fill();
    }

    function drawWeapon() {
      const o = origin();

      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(-0.018 - recoil * 0.012);

      drawShadow(o.scale);

      if (weaponIndex === 0) {
        drawWarden(o.scale);
      } else if (weaponIndex === 1) {
        drawHelios(o.scale);
      } else {
        drawVoidbreach(o.scale);
      }

      ctx.restore();
    }

    function drawMuzzleFlash(scale) {
      if (muzzleAmount < 0.01) {
        return;
      }

      const o = origin();
      const position = muzzlePosition();

      ctx.save();
      ctx.translate(position.x, position.y);
      ctx.globalCompositeOperation = "lighter";

      if (weaponIndex === 1) {
        const gradient = ctx.createRadialGradient(
          0,
          0,
          2,
          0,
          0,
          145 * scale * muzzleAmount
        );

        gradient.addColorStop(0, "rgba(235,255,255,.95)");
        gradient.addColorStop(0.14, "rgba(95,245,255,.9)");
        gradient.addColorStop(0.5, "rgba(30,190,255,.28)");
        gradient.addColorStop(1, "rgba(20,170,255,0)");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, 145 * scale * muzzleAmount, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = `rgba(195,252,255,${muzzleAmount})`;
        ctx.lineWidth = 3 * scale;
        ctx.beginPath();
        ctx.arc(0, 0, 38 * scale * muzzleAmount, 0, Math.PI * 2);
        ctx.stroke();
      } else if (weaponIndex === 2) {
        const gradient = ctx.createRadialGradient(
          0,
          0,
          2,
          0,
          0,
          170 * scale * muzzleAmount
        );

        gradient.addColorStop(0, "rgba(255,238,255,.98)");
        gradient.addColorStop(0.12, "rgba(225,160,255,.95)");
        gradient.addColorStop(0.38, "rgba(145,70,255,.42)");
        gradient.addColorStop(0.72, "rgba(95,40,210,.16)");
        gradient.addColorStop(1, "rgba(80,20,180,0)");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, 170 * scale * muzzleAmount, 0, Math.PI * 2);
        ctx.fill();
      } else {
        const gradient = ctx.createRadialGradient(
          0,
          0,
          2,
          0,
          0,
          120 * scale * muzzleAmount
        );

        gradient.addColorStop(0, "rgba(255,255,245,1)");
        gradient.addColorStop(0.11, "rgba(255,242,178,1)");
        gradient.addColorStop(0.28, "rgba(255,190,95,.96)");
        gradient.addColorStop(0.58, "rgba(255,110,28,.48)");
        gradient.addColorStop(0.8, "rgba(248,70,10,.12)");
        gradient.addColorStop(1, "rgba(255,70,10,0)");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, 120 * scale * muzzleAmount, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(255,244,202,${muzzleAmount})`;
        ctx.rotate(elapsed * 0.017);

        for (let i = 0; i < 9; i++) {
          ctx.save();
          ctx.rotate(i * (Math.PI * 2) / 9);
          ctx.beginPath();
          ctx.moveTo(4 * scale, 0);
          ctx.lineTo(
            (48 + Math.abs(Math.sin(i * 2)) * 36) * scale * muzzleAmount,
            -(8 + i % 4 * 4) * scale
          );
          ctx.lineTo(
            (42 + i * 3) * scale * muzzleAmount,
            (9 + i % 3 * 4) * scale
          );
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      ctx.restore();
    }

    function update(delta) {
      recoil = Math.max(0, recoil - delta * 5.4);
      boltTravel = Math.max(0, boltTravel - delta * 8);
      muzzleAmount = Math.max(
        0,
        muzzleAmount - delta * (weaponIndex === 1 ? 7 : 11)
      );

      if (mouseDown) {
        fireWeapon();
      }

      for (const particle of particles) {
        particle.life += delta;
        particle.x += particle.vx * delta;
        particle.y += particle.vy * delta;
        particle.vy += 120 * delta;
        particle.alpha = 1 - particle.life / particle.maxLife;
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      for (const spark of sparks) {
        spark.life += delta;
        spark.x += spark.vx * delta;
        spark.y += spark.vy * delta;
        spark.vy += 260 * delta;
        spark.alpha = 1 - spark.life / spark.maxLife;
      }

      for (let i = sparks.length - 1; i >= 0; i--) {
        if (sparks[i].alpha <= 0) {
          sparks.splice(i, 1);
        }
      }

      for (const casing of casings) {
        casing.life += delta;
        casing.x += casing.vx * delta;
        casing.y += casing.vy * delta;
        casing.vy += 260 * delta;
        casing.rotation += casing.vr * delta;
        casing.alpha = 1 - casing.life / casing.maxLife;
      }

      for (let i = casings.length - 1; i >= 0; i--) {
        if (casings[i].alpha <= 0) {
          casings.splice(i, 1);
        }
      }

      for (const cloud of smoke) {
        cloud.life += delta;
        cloud.x += cloud.vx * delta;
        cloud.y += cloud.vy * delta;
        cloud.vx *= Math.pow(0.96, delta * 60);
        cloud.vy -= 5 * delta;
        cloud.radius += 8 * delta;
        cloud.alpha = (1 - cloud.life / cloud.maxLife) * 0.18;
        cloud.spin += delta * 0.25;
      }

      for (let i = smoke.length - 1; i >= 0; i--) {
        if (smoke[i].life >= smoke[i].maxLife) {
          smoke.splice(i, 1);
        }
      }

      for (const tracer of tracers) {
        tracer.alpha -= delta * (tracer.type === 1 ? 4 : 7);
      }

      for (let i = tracers.length - 1; i >= 0; i--) {
        if (tracers[i].alpha <= 0) {
          tracers.splice(i, 1);
        }
      }

      for (const ring of rings) {
        ring.alpha -= delta * 2.8;
        ring.radius += delta * ring.growth;
      }

      for (let i = rings.length - 1; i >= 0; i--) {
        if (rings[i].alpha <= 0) {
          rings.splice(i, 1);
        }
      }
    }

    function drawEffects(scale) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      for (const tracer of tracers) {
        ctx.globalAlpha = tracer.alpha;

        const gradient = ctx.createLinearGradient(
          tracer.x1,
          tracer.y1,
          tracer.x2,
          tracer.y2
        );

        if (tracer.type === 1) {
          gradient.addColorStop(0, "rgba(235,255,255,1)");
          gradient.addColorStop(0.15, "rgba(80,245,255,.95)");
          gradient.addColorStop(0.55, "rgba(35,205,255,.55)");
          gradient.addColorStop(1, "rgba(20,180,255,0)");
        } else if (tracer.type === 2) {
          gradient.addColorStop(0, "rgba(255,245,255,1)");
          gradient.addColorStop(0.12, "rgba(220,150,255,.95)");
          gradient.addColorStop(0.55, "rgba(150,70,255,.45)");
          gradient.addColorStop(1, "rgba(100,30,255,0)");
        } else {
          gradient.addColorStop(0, "rgba(255,240,190,.7)");
          gradient.addColorStop(0.2, "rgba(255,172,75,.9)");
          gradient.addColorStop(1, "rgba(255,120,40,0)");
        }

        ctx.strokeStyle = gradient;
        ctx.lineWidth = tracer.width * scale;
        ctx.beginPath();
        ctx.moveTo(tracer.x1, tracer.y1);
        ctx.quadraticCurveTo(
          tracer.x1 + (tracer.x2 - tracer.x1) * 0.5,
          tracer.y1 - 8 * scale,
          tracer.x2,
          tracer.y2
        );
        ctx.stroke();
        ctx.lineCap = "round";
      }

      for (const ring of rings) {
        ctx.globalAlpha = ring.alpha * 0.8;
        ctx.strokeStyle = ring.cyan ? "#87f7ff" : "#d7a0ff";
        ctx.lineWidth = 2 * scale;
        ctx.beginPath();
        ctx.arc(
          ring.x,
          ring.y,
          ring.radius * scale,
          0,
          Math.PI * 2
        );
        ctx.stroke();
      }

      for (const particle of particles) {
        ctx.globalAlpha = particle.alpha;
        ctx.fillStyle =
          particle.type === 2 ? "#cf8cff" : "#ffc878";

        ctx.beginPath();
        ctx.arc(
          particle.x,
          particle.y,
          particle.radius * scale,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      for (const spark of sparks) {
        ctx.globalAlpha = spark.alpha;
        ctx.fillStyle = "#aef8ff";
        ctx.beginPath();
        ctx.arc(
          spark.x,
          spark.y,
          spark.radius * scale,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      ctx.restore();

      for (const cloud of smoke) {
        ctx.save();
        ctx.translate(cloud.x, cloud.y);
        ctx.rotate(cloud.spin);
        ctx.globalAlpha = cloud.alpha;

        const gradient = ctx.createRadialGradient(
          0,
          0,
          cloud.radius * 0.1,
          0,
          0,
          cloud.radius
        );

        gradient.addColorStop(
          0,
          "rgba(188,192,188,.9)"
        );
        gradient.addColorStop(
          0.55,
          "rgba(125,128,125,.5)"
        );
        gradient.addColorStop(
          1,
          "rgba(90,92,91,0)"
        );

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, cloud.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      for (const casing of casings) {
        ctx.save();
        ctx.translate(casing.x, casing.y);
        ctx.rotate(casing.rotation);
        ctx.globalAlpha = casing.alpha;

        ctx.fillStyle = "#9a702f";
        roundedRectangle(
          -7 * scale,
          -3 * scale,
          14 * scale,
          6 * scale,
          2 * scale
        );
        ctx.fill();

        ctx.fillStyle = "#dec278";
        roundedRectangle(
          -5 * scale,
          -2 * scale,
          8 * scale,
          4 * scale,
          1 * scale
        );
        ctx.fill();

        ctx.restore();
      }
    }

    function frame(now) {
      if (!lastFrame) {
        lastFrame = now;
      }

      const delta = Math.min(
        0.033,
        (now - lastFrame) / 1000
      );

      lastFrame = now;
      elapsed = now;

      update(delta);

      ctx.clearRect(0, 0, width, height);

      drawBackground(now);

      drawWeapon();

      const scale = Math.min(width, height) / 720;

      drawMuzzleFlash(scale);
      drawEffects(scale);

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
